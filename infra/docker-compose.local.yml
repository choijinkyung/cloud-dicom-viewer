services:
  postgres:
    image: postgres:16
    container_name: dicomviewer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dicom_viewer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dicomviewer-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: dicomviewer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  orthanc:
    image: orthancteam/orthanc:24.2.3
    container_name: dicomviewer-orthanc
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME:-orthanc}":"${ORTHANC_PASSWORD:-orthanc}"}
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ../services/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro

  hapi-fhir-db:
    image: postgres:16
    container_name: dicomviewer-hapi-db
    environment:
      POSTGRES_DB: ${FHIR_DB_NAME:-hapi}
      POSTGRES_USER: ${FHIR_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${FHIR_DB_PASSWORD:-hapi}
    ports:
      - "5433:5432"
    volumes:
      - hapi_postgres_data:/var/lib/postgresql/data

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: dicomviewer-hapi-fhir
    depends_on:
      - hapi-fhir-db
    ports:
      - "8080:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: dicomviewer-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"

  nextgen-connect:
    image: nextgenhealthcare/connect:latest
    container_name: dicomviewer-nextgen-connect
    ports:
      - "8082:8080"
      - "6661:6661"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  orthanc_data:
  hapi_postgres_data:
